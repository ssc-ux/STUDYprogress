<style>
/* Direction « Revue » : papier clair, encre marine, un seul accent (vert canard), listes denses plutôt que cartes. */
:root{color-scheme:light;--bg:#fbfaf7;--surface:#fff;--fg:#14202e;--muted:#5d6878;--line:#e4e2dc;--soft:#f3f1ec;--acc:#0d6b63;--accb:#e2f0ee;--fr:#1f4fb5;--frb:#e8edfb;--warn:#9a5b00;--ok:#0d7a55;--fol:#3d55b0;--stop:#b23b3b;--now:#d2512f;--star:#c78f00}

:root[data-theme="dark"]{color-scheme:dark;--bg:#10161d;--surface:#18212b;--fg:#e7ecf2;--muted:#98a4b3;--line:#2a3644;--soft:#1e2833;--acc:#4fc3b4;--accb:#173533;--fr:#9db2ff;--frb:#1f2a48;--warn:#f0b56a;--ok:#5fd3a6;--fol:#a5b6ff;--stop:#f29a9a;--now:#ff8a63;--star:#f2c443}
*{box-sizing:border-box}
[hidden]{display:none!important}

button,select,input{font:inherit;color:inherit}

.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}

.badge{font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:5px;white-space:nowrap}

.flag i{flex:1}.flag i:nth-child(1){background:#1f4fb5}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#d62b3a}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500;color:var(--c,var(--muted))}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st-soon{--c:var(--warn)}.st-rec{--c:var(--ok)}.st-fol{--c:var(--fol)}.st-stop{--c:var(--stop)}.st-res{--c:var(--acc)}

.fav{position:relative;z-index:1;background:none;border:0;cursor:pointer;color:var(--muted);font-size:1.05rem;line-height:1;padding:6px;border-radius:8px;justify-self:end}

/* Liste et filtres */

.fbar select.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;white-space:nowrap}

@media (max-width:720px){.fbar select{flex:1 1 40%;min-width:0}}
.link{background:none;border:0;padding:0;color:var(--acc);font-weight:500;cursor:pointer;font-size:.85rem}

.empty{color:var(--muted);padding:26px 16px;text-align:center}

.cat{margin:26px 0 8px;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}

.nums{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 6px}
.num{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px;min-width:120px;flex:1}

.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:860px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.pipe{grid-template-columns:minmax(0,1fr)}.pcol .pi:nth-of-type(n+6){display:none}}

.pcol{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:6px;align-content:start}

.pi{display:block;padding:7px 8px;border-radius:8px;background:var(--soft);text-decoration:none;color:inherit;font-size:.82rem;line-height:1.35}
.pi:hover{outline:1px solid var(--acc)}
.pi b{display:block;font-weight:600;overflow-wrap:anywhere}
.pi>span{color:var(--muted);font-size:.76rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.pcol .all{font-size:.8rem;padding:2px 4px;text-decoration:none}
/* Fiche */
.back{display:inline-block;margin:20px 0 14px;color:var(--acc);font-weight:500;font-size:.88rem;background:none;border:0;padding:0;cursor:pointer}

.lead-q{font-family:"Source Serif 4",Georgia,serif;font-weight:500;font-size:clamp(1.15rem,2.6vw,1.4rem);line-height:1.35;margin:0 0 12px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;min-width:0}

.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}

.raw{white-space:pre-wrap;font-size:.84rem;color:var(--muted);max-height:420px;overflow:auto;background:var(--soft);border-radius:8px;padding:12px 14px;margin-top:8px}
details summary{cursor:pointer;color:var(--acc);font-weight:500;font-size:.9rem}
.note{font-size:.8rem;color:var(--muted);margin:0 2px 12px}

.steps{display:flex;gap:4px;margin:0 0 18px;overflow-x:auto}

      <input id="q" type="search" placeholder="Maladie, molécule, acronyme, promoteur, ville…" autocomplete="off" aria-label="Rechercher une étude">
      <select id="fDis" aria-label="Maladie"></select>
      <select id="fSt" aria-label="Avancement"><option value="">Tous les stades</option><option value="act">À venir ou en cours</option><option value="soon">À venir (pas encore ouvertes)</option><option value="rec">Inclusions en cours</option><option value="fol">Suivi (inclusions closes)</option><option value="done">Terminées ou arrêtées</option><option value="res">Résultats de phase 3 (6 mois)</option><option value="new">Nouvelles sur le site (30 j)</option><option value="chg">Statut modifié (30 j)</option></select>
      <select id="fTy" aria-label="Type d'étude"><option value="">Tous types</option><option value="int">Essais interventionnels</option><option value="p1">Phase 1</option><option value="p2">Phase 2</option><option value="p3">Phase 3</option><option value="p4">Phase 4</option><option value="rnd">Essais randomisés</option><option value="obs">Observationnelles, cohortes</option></select>
      <select id="fOr" aria-label="Origine"><option value="">Toutes origines</option><option value="promo">Promotion française</option><option value="fr">Avec centres en France</option></select>
      <select id="fVille" aria-label="Ville"></select>
      <select id="fSp" aria-label="Promoteur"><option value="">Tous promoteurs</option><option value="acad">Académique</option><option value="ind">Industriel</option></select>
      <select id="fSo" aria-label="Tri"><option value="">Tri : pertinence</option><option value="new">Début le plus récent</option><option value="end">Fin prévue la plus proche</option><option value="fin">Terminées récemment</option><option value="seen">Ajout récent sur le site</option></select>
      <label class="chk"><input type="checkbox" id="fFi">Fiche en français</label>
      <label class="chk"><input type="checkbox" id="fFav">★ Suivies</label>
    </div>
    <div class="count"><span id="count"></span><button class="link" id="fReset" hidden>Réinitialiser les filtres</button></div>
    <div class="tbl"><div class="thead"><span>Étude</span><span>Maladie</span><span>Type</span><span>Avancement</span><span style="text-align:right">Patients</span><span>Fin prévue</span><span></span></div><div id="list"></div></div>
    <button class="more" id="moreList" hidden>Afficher plus</button>
  </div>

  <div id="vDis" hidden></div>
  <div id="vStudy" hidden></div>

</main>
<footer><div class="wrap">Données <a href="https://clinicaltrials.gov" target="_blank" rel="noopener">ClinicalTrials.gov</a>, mises à jour le <span id="upd"></span>. Fiches en français générées automatiquement, le registre fait foi. Site d'information destiné aux médecins.</div></footer>

<script>
const $ = id => document.getElementById(id);
const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const FLAG = `<span class="flag" role="img" aria-label="Promotion française" title="Promotion française"><i></i><i></i><i></i></span>`;
const ST = {
  NOT_YET_RECRUITING: ["À venir", "soon"], RECRUITING: ["Inclusions", "rec"], ENROLLING_BY_INVITATION: ["Inclusions", "rec"],
  ACTIVE_NOT_RECRUITING: ["Suivi", "fol"], COMPLETED: ["Terminée", "done"], TERMINATED: ["Arrêtée", "stop"]
};
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const fdate = d => d ? `${MOIS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}` : "";
const fday = d => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
const age = a => a ? a.replace(/Years?/, "ans").replace(/Months?/, "mois").replace(/Weeks?/, "semaines").replace(/Days?/, "jours") : "—";
const ms = d => new Date(d.length === 7 ? d + "-15" : d).getTime();
const days = (a, b) => (ms(b) - ms(a)) / 864e5;
const plur = (n, w) => `${n.toLocaleString("fr-FR")} ${w}${n > 1 ? "s" : ""}`;
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };

let DATA = [], DIS = {}, CATS = [], updated = "";
let favs = new Set();
try { favs = new Set(JSON.parse(store("sp-favs") || "[]")); } catch {}

const recent = d => d && days(d, updated) <= 30;
const isNew = s => recent(s.seen) || recent(s.chg);
const stOf = s => s.status === "COMPLETED" && s.res ? ["Résultats", "res"] : ST[s.status] || [s.status, ""];
const stTag = s => { const [l, c] = stOf(s); return `<span class="st st-${c}">${l}</span>`; };
const typeTxt = s => s.type === "OBSERVATIONAL" ? "Observationnelle" : s.phase.replace(/Phase (\d)\/Phase (\d)/, "Phase $1/$2") || "Essai";
const phaseN = s => Math.max(0, ...(s.phase.match(/\d/g) || []).map(Number));
const frRank = s => s.fr === "promo" ? 0 : s.fr ? 1 : 2;
const rank = (a, b) => frRank(a) - frRank(b) || !!b.q - !!a.q || (b.start || "").localeCompare(a.start || "");
const disNames = s => { const a = s.dis.map(d => DIS[d]?.fr).filter(Boolean); return a.slice(0, 2).join(", ") + (a.length > 2 ? ` +${a.length - 2}` : ""); };

// Filtres : chaque clé d'URL correspond à un contrôle de la liste.
const CTRL = { q: "q", dis: "fDis", st: "fSt", ty: "fTy", or: "fOr", v: "fVille", sp: "fSp", so: "fSo", fi: "fFi", fav: "fFav" };
const IN = (...a) => s => a.includes(s.status);
const STF = {
  soon: IN("NOT_YET_RECRUITING"), rec: IN("RECRUITING", "ENROLLING_BY_INVITATION"), fol: IN("ACTIVE_NOT_RECRUITING"),
  act: IN("NOT_YET_RECRUITING", "RECRUITING", "ENROLLING_BY_INVITATION", "ACTIVE_NOT_RECRUITING"),
  run: IN("RECRUITING", "ENROLLING_BY_INVITATION", "ACTIVE_NOT_RECRUITING"),
  done: IN("COMPLETED", "TERMINATED"), res: s => s.res && STF.done(s) && s.phase.includes("3") && days(s.rd, updated) <= 183, new: s => recent(s.seen), chg: s => recent(s.chg)
};
const TYF = { int: s => s.type === "INTERVENTIONAL", obs: s => s.type === "OBSERVATIONAL", rnd: s => !!s.rnd, p1: s => s.phase.includes("1"), p2: s => s.phase.includes("2"), p3: s => s.phase.includes("3"), p4: s => s.phase.includes("4") };
const SORT = {
  "": rank, new: (a, b) => (b.start || "").localeCompare(a.start || ""), end: (a, b) => (a.pcd || "9999").localeCompare(b.pcd || "9999"),
  fin: (a, b) => (b.pcd || "").localeCompare(a.pcd || ""), seen: (a, b) => (b.seen || "").localeCompare(a.seen || "") || rank(a, b)
};
const href = (path, o = {}) => { const q = new URLSearchParams(Object.entries(o).filter(([, v]) => v)).toString(); return "#/" + path + (q ? "?" + q : ""); };
const apply = (list, f) => {
  const terms = norm(f.q).split(/\s+/).filter(Boolean);
  return list.filter(s =>
    (!f.dis || (f.dis.startsWith("c:") ? s.dis.some(d => DIS[d].cat === f.dis.slice(2)) : s.dis.includes(f.dis))) &&
    (!f.st || !STF[f.st] || STF[f.st](s)) && (!f.ty || !TYF[f.ty] || TYF[f.ty](s)) &&
    (!f.or || (f.or === "promo" ? s.fr === "promo" : !!s.fr)) && (!f.v || s.v.includes(f.v)) &&
    (!f.sp || (s.sClass === "INDUSTRY") === (f.sp === "ind")) && (!f.fi || s.q) && (!f.fav || favs.has(s.id)) &&
    terms.every(t => s._txt.includes(t)));
};

// ——— Ligne d'étude ———
function row(s) {
  const on = favs.has(s.id);
  return `<div class="row">
    <div><div class="r-h">${s.fr === "promo" ? FLAG : ""}<span class="r-ac"><a href="#/${s.id}">${esc(s.acr || s.id)}</a></span>${s.fr === "centres" ? `<span class="badge b-fr">${s.frN} centre${s.frN > 1 ? "s" : ""} FR</span>` : ""}${isNew(s) ? `<span class="badge b-new">Nouveau</span>` : ""}${s.q ? "" : `<span class="badge b-en" title="Fiche en français pas encore rédigée">EN</span>`}</div>
      <div class="r-t${s.q ? " q" : ""}"${s.q ? "" : ` lang="en"`}>${esc(s.q || s.t)}</div></div>
    <button class="fav" data-f="${s.id}" aria-pressed="${on}" aria-label="Suivre ${esc(s.acr || s.id)}" title="Suivre cette étude">${on ? "★" : "☆"}</button>
    <div class="r-meta"><span>${esc(disNames(s))}</span><span>${esc(typeTxt(s))}</span>${stTag(s)}<span class="r-n">${s.n ?? ""}</span><span class="r-end">${fdate(s.pcd) || "—"}</span></div>
  </div>`;
}
// Sur grand écran, l'étoile est la dernière colonne : on la replace après les métadonnées.
const rows = a => a.map(row).join("").replace(/(<button class="fav"[^]*?<\/button>)\s*(<div class="r-meta">[^]*?<\/div>)(?=\s*<\/div>)/g, "$2$1");
const panel = (title, list, all, sub = "", max = 5) => !list.length ? "" : `<section class="panel"><div class="ph"><h2>${title} <span class="n">${list.length}</span></h2>${list.length > max && all ? `<a class="all" href="${all}">Tout voir →</a>` : ""}${sub ? `<p>${sub}</p>` : ""}</div><div class="tbl">${rows(list.slice(0, max))}</div></section>`;

// ——— Accueil ———
function cities(min = 2) {
  const c = {}; for (const s of DATA) for (const v of s.v) c[v] = (c[v] || 0) + 1;
  return Object.keys(c).filter(v => c[v] >= min).sort((a, b) => a.localeCompare(b, "fr"));
}
function disGrid() {
  return CATS.map(c => `<h3 class="cat">${esc(c)}</h3><div class="dgrid">${Object.values(DIS).filter(d => d.cat === c).map(d => {
    const a = DATA.filter(s => s.dis.includes(d.id)), act = a.filter(STF.act).length, f = a.filter(s => s.fr === "promo").length;
    return `<a class="dz" href="#/maladie/${d.id}"><b>${esc(d.fr)}</b><span>${plur(act, "étude")} en cours${f ? ` · ${f} française${f > 1 ? "s" : ""}` : ""}</span></a>`;
  }).join("")}</div>`).join("");
}
function renderHome() {
  const n = k => DATA.filter(STF[k]).length, ville = store("sp-ville") || "";
  const nw = DATA.filter(STF.new).sort(rank);
  // Nouvelles études à promotion française (à venir ou qui recrutent, démarrées depuis moins d'un an) : phases 3-4 d'abord.
  const fr = DATA.filter(s => s.fr === "promo" && (STF.soon(s) || STF.rec(s)) && (!s.start || days(s.start, updated) <= 365))
    .sort((a, b) => (phaseN(b) >= 3) - (phaseN(a) >= 3) || (b.start || "9999").localeCompare(a.start || "9999"));
  const rs = DATA.filter(STF.res).sort((a, b) => (b.pub > 0) - (a.pub > 0) || SORT.fin(a, b));
  const fv = DATA.filter(s => favs.has(s.id)).sort((a, b) => isNew(b) - isNew(a) || rank(a, b));
  const local = ville ? DATA.filter(s => s.v.includes(ville) && (STF.rec(s) || STF.soon(s))).sort(rank) : [];
  $("vHome").innerHTML = `<section class="hero">
      <p class="eyebrow">Mise à jour du ${fday(updated)}</p>
      <h1>La recherche clinique en médecine interne, lisible en une minute.</h1>
      <p class="lead">Ce qui démarre, ce qui recrute dans votre ville, ce qui vient d'être publié : chaque étude résumée par sa question, son schéma et son intérêt pour la pratique.</p>
      <form class="hsearch" id="hform"><input id="hq" type="search" placeholder="Lupus, rituximab, CAR-T, GFEV…" autocomplete="off" aria-label="Rechercher une étude"><button class="btnp" type="submit">Chercher</button></form>
      <div class="kpis"><a href="${href("etudes", { st: "run" })}"><b>${n("run").toLocaleString("fr-FR")}</b>études en cours</a><a href="${href("etudes", { st: "soon" })}"><b>${n("soon")}</b>à venir</a><a href="${href("etudes", { or: "promo" })}"><b>${DATA.filter(s => s.fr === "promo").length}</b>à promotion française</a><a href="${href("etudes", { st: "res", so: "fin" })}"><b>${n("res")}</b>résultats de phase 3</a></div>
    </section>
    ${panel("Nouvelles études françaises", fr, href("etudes", { or: "promo", st: "act", so: "new" }), "Coordonnées par un centre français, à venir ou en cours d'inclusion, démarrées depuis moins d'un an. Phases 3 et 4 en premier.", 8)}
    ${panel("Mes études suivies", fv, href("etudes", { fav: 1 }), "", 6)}
    ${panel("Nouvelles ce mois-ci", nw, href("etudes", { st: "new", so: "seen" }), "Études apparues au registre depuis moins de 30 jours, françaises d'abord.")}
    <section class="panel"><div class="ph"><h2><label for="ville">Ouvertes aux inclusions à</label></h2><select id="ville"><option value="">choisir une ville…</option>${cities().map(v => `<option${v === ville ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>${local.length > 6 ? `<a class="all" href="${href("etudes", { v: ville, st: "rec" })}">Tout voir →</a>` : ""}</div>
      ${!ville ? `<p class="hint">Choisissez votre ville d'internat : le site retient ce choix et affiche ici les études qui recrutent ou vont ouvrir dans ses centres.</p>` : local.length ? `<div class="tbl">${rows(local.slice(0, 6))}</div>` : `<p class="hint">Aucune étude ouverte déclarée dans cette ville pour le moment.</p>`}</section>
    ${panel("Résultats récents", rs, href("etudes", { st: "res", so: "fin" }), "Essais de phase 3 dont les résultats ont été déposés au registre ou publiés depuis moins de 6 mois.")}
    <section class="panel"><div class="ph"><h2>Explorer par maladie</h2><p>Pour chaque maladie : les molécules en développement par phase, les cohortes et les résultats.</p></div>${disGrid()}</section>`;
}

// ——— Liste ———
let shown = 50, lastQS = null;
const getF = () => Object.fromEntries(Object.entries(CTRL).map(([k, id]) => [k, $(id).type === "checkbox" ? ($(id).checked ? "1" : "") : $(id).value.trim()]));
function setF(q) { for (const [k, id] of Object.entries(CTRL)) { const e = $(id), v = q.get(k) || ""; if (e.type === "checkbox") e.checked = !!v; else { e.value = v; if (e.value !== v) e.value = ""; } } }
function renderList() {
  const f = getF(), r = apply(DATA, f).sort(SORT[f.so] || rank), nfr = r.filter(s => s.fr === "promo").length;
  const d = f.dis && (f.dis.startsWith("c:") ? f.dis.slice(2) : DIS[f.dis]?.fr);
  const title = f.fav ? "Mes études suivies" : f.st === "res" ? "Résultats" + (d ? ` · ${d}` : "") : d || (f.v ? `Études à ${f.v}` : "Toutes les études");
  $("listTitle").textContent = title; document.title = `${title} · STUDYprogress`;
  $("count").textContent = `${plur(r.length, "étude")}${nfr ? `, dont ${nfr} à promotion française` : ""}`;
  $("fReset").hidden = !Object.entries(f).some(([k, v]) => v && k !== "so");
  for (const id of Object.values(CTRL)) if ($(id).tagName === "SELECT") $(id).classList.toggle("on", !!$(id).value && id !== "fSo");
  $("list").innerHTML = r.length ? rows(r.slice(0, shown)) : `<p class="empty">${f.fav ? "Aucune étude suivie pour l'instant : touchez l'étoile ☆ d'une étude pour la retrouver ici." : "Aucune étude ne correspond. Élargissez la recherche ou retirez un filtre."}</p>`;
  $("moreList").hidden = r.length <= shown;
  $("moreList").textContent = `Afficher plus (${r.length - shown} restantes)`;
}
function onFilter() { shown = 50; const h = href("etudes", getF()); lastQS = h; history.replaceState(null, "", h); renderList(); tabs(); }

// ——— Maladies ———
function renderDisease(id) {
  const d = DIS[id];
  if (!d) { document.title = "Maladies · STUDYprogress"; $("vDis").innerHTML = `<h1 class="pt">Par maladie</h1><p style="color:var(--muted);margin:-6px 0 0">${Object.keys(DIS).length} maladies suivies. Chaque page montre les traitements en développement, phase par phase.</p>${disGrid()}`; return; }
  document.title = `${d.fr} · STUDYprogress`;
  const a = DATA.filter(s => s.dis.includes(id)), act = a.filter(STF.act), tr = act.filter(TYF.int);
  const L = o => href("etudes", { dis: id, ...o });
  const col = p => {
    const l = tr.filter(s => phaseN(s) === p).sort((x, y) => frRank(x) - frRank(y) || !!y.iv.length - !!x.iv.length || SORT.new(x, y));
    return `<div class="pcol"><h3>Phase ${p}<span>${l.length}</span></h3>${l.slice(0, 10).map(s => `<a class="pi" href="#/${s.id}"><b>${esc(s.iv.join(" + ") || s.acr || s.id)}</b><span>${s.fr === "promo" ? FLAG : ""}${s.iv.length ? esc(s.acr || s.id) + " · " : ""}${stOf(s)[0]}${s.n ? ` · ${s.n} pts` : ""}</span></a>`).join("") || `<span class="none">Aucun essai en cours.</span>`}${l.length > 5 ? `<a class="all${l.length > 10 ? "" : " mob"}" href="${L({ ty: "p" + p, st: "act" })}">Voir les ${l.length} essais →</a>` : ""}</div>`;
  };
  $("vDis").innerHTML = `<p class="crumb"><a href="#/maladies">Maladies</a> › ${esc(d.cat)}</p><h1 class="pt">${esc(d.fr)}</h1>
    <div class="nums"><div class="num"><b>${act.length}</b><span>études à venir ou en cours</span></div><div class="num"><b>${tr.filter(s => phaseN(s) >= 3).length}</b><span>essais de phase 3 ou 4</span></div><div class="num"><b>${a.filter(s => s.fr === "promo").length}</b><span>à promotion française</span></div><div class="num"><b>${a.filter(STF.res).length}</b><span>résultats de phase 3 (6 mois)</span></div></div>
    <section class="panel"><div class="ph"><h2>Traitements en développement</h2><a class="all" href="${L({ ty: "int", st: "act" })}">Tous les essais →</a><p>Essais à venir ou en cours, classés par phase : la molécule testée, puis l'acronyme et l'avancement.</p></div><div class="pipe">${[1, 2, 3, 4].map(col).join("")}</div></section>
    ${panel("Stratégies, dispositifs et autres essais", tr.filter(s => !phaseN(s)).sort(rank), L({ ty: "int", st: "act" }), "Essais sans phase : stratégies thérapeutiques, rééducation, dispositifs, examens.")}
    ${panel("Cohortes et études observationnelles", act.filter(TYF.obs).sort(rank), L({ ty: "obs", st: "act" }))}
    ${panel("Terminées récemment", a.filter(STF.done).sort((x, y) => y.res - x.res || SORT.fin(x, y)), L({ st: "done", so: "fin" }), "Études avec résultats d'abord.")}
    <p style="margin-top:26px"><a class="btnp" href="${L({})}">Voir les ${a.length} études · ${esc(d.fr)}</a></p>`;
}


// ——— Fiche étude ———
const STEPS = ["Annoncée", "Inclusions", "Suivi", "Terminée", "Résultats"];
const stepOf = s => ({ NOT_YET_RECRUITING: 0, RECRUITING: 1, ENROLLING_BY_INVITATION: 1, ACTIVE_NOT_RECRUITING: 2, COMPLETED: s.hasResults || s.pubs.length ? 4 : 3, TERMINATED: 3 })[s.status] ?? 1;
const paras = t => esc(t).split(/\n\s*\n/).map(p => `<p>${p}</p>`).join("");
const ALLOC = { RANDOMIZED: "randomisée", NON_RANDOMIZED: "non randomisée", NA: "" };
const MASK = { NONE: "en ouvert", SINGLE: "simple aveugle", DOUBLE: "double aveugle", TRIPLE: "triple aveugle", QUADRUPLE: "quadruple aveugle" };

function calendar(s) {
  const k = stepOf(s), stopped = s.status === "TERMINATED";
  const steps = `<div class="steps">${STEPS.map((l, i) => `<span class="${i < k ? "done" : i === k ? (stopped ? "stop" : "cur") : ""}">${i === 3 && stopped ? "Arrêtée" : l}</span>`).join("")}</div>`;
  if (!s.start) return steps;
  const end = s.end && s.end > (s.pcd || s.start) ? s.end : s.pcd;
  const y0 = Math.min(+s.start.slice(0, 4), +updated.slice(0, 4)), y1 = Math.max(+(end || s.start).slice(0, 4), +updated.slice(0, 4)) + 1;
  const lo = ms(`${y0}-01-01`), W = ms(`${y1}-01-01`) - lo, x = d => ((ms(d) - lo) / W * 100).toFixed(2), t = x(updated);
  const bar = (a, b, cls) => {
    if (!a || !b || b <= a) return "";
    const past = updated > a ? (updated < b ? updated : b) : a;
    return `<i class="${cls}" style="left:${x(a)}%;width:${x(past) - x(a)}%"></i><i class="${cls} f" style="left:${x(past)}%;width:${x(b) - x(past)}%"></i>`;
  };
  const years = Array.from({ length: y1 - y0 + 1 }, (_, i) => y0 + i).slice(0, -1).filter((y, i, a) => a.length <= 8 || i % Math.ceil(a.length / 8) === 0);
  const line = (lab, html) => `<span>${lab}</span><div class="trk">${html}<span class="today" style="left:${t}%"></span></div>`;
  return `${steps}<div class="cal"><div class="calg"><span></span><div class="yrs">${years.map(y => `<span style="left:${x(`${y}-01-01`)}%">${y}</span>`).join("")}</div>
    ${line(`Inclusions et traitement<br><small>${fdate(s.start)} → ${fdate(s.pcd) || "?"}</small>`, bar(s.start, s.pcd, ""))}
    ${end && s.pcd && end > s.pcd ? line(`Suivi<br><small>jusqu'à ${fdate(end)}</small>`, bar(s.pcd, end, "p")) : ""}
  </div></div><div class="calk"><span><i></i>réalisé</span><span><i class="f"></i>prévu</span><span><i class="n"></i>aujourd'hui (${fdate(updated)})</span></div>`;
}
function schema(s, x) {
  const arms = x?.bras?.length ? x.bras.map(b => [b.nom, b.traitement]) : s.arms.map(a => [a.l, a.i.join(", ") || a.d]);
  const rnd = s.alloc === "RANDOMIZED", crit = x?.critere || s.primary[0]?.m || "";
  const meta = `<div class="dmeta">${s.type === "OBSERVATIONAL" ? "<span>Étude observationnelle</span>" : `<span>Étude ${[ALLOC[s.alloc], MASK[s.mask]].filter(Boolean).join(", ") || "interventionnelle"}${s.phase ? `, ${s.phase.toLowerCase()}` : ""}</span>`}${x?.duree ? `<span>Durée par patient : ${esc(x.duree)}</span>` : ""}${s.n ? `<span>${s.n} patients ${s.nType === "ACTUAL" ? "inclus" : "prévus"}</span>` : ""}</div>`;
  if (!arms.length) return meta;
  return `<div class="design"><div class="dzg${rnd ? "" : " nr"}">
    <div class="box"><b>Inclusion</b>${s.n ? `${s.n} patients` : ""}</div><div class="ar"></div>
    ${rnd ? `<div class="rz" title="Randomisation">R</div><div class="ar"></div>` : ""}
    <div class="arms">${arms.slice(0, 4).map(([n, t]) => `<div class="arm"><b>${esc(n)}</b>${esc((t || "").length > 160 ? t.slice(0, 157) + "…" : t)}</div>`).join("")}${arms.length > 4 ? `<div style="font-size:.8rem;color:var(--muted)">+ ${arms.length - 4} autre${arms.length > 5 ? "s" : ""} bras</div>` : ""}</div><div class="ar"></div>
    <div class="end"><b>Critère principal</b>${esc(crit.length > 170 ? crit.slice(0, 167) + "…" : crit) || "non précisé"}</div>
  </div></div>${meta}`;
}
async function renderStudy(id) {
  const v = $("vStudy"), back = `<button class="back" data-back>← Retour</button>`;
  v.innerHTML = `<p style="color:var(--muted);padding:40px 0">Chargement…</p>`;
  let s;
  try { const r = await fetch(`data/s/${id}.json`); if (!r.ok) throw 0; s = await r.json(); }
  catch { v.innerHTML = `${back}<p>Cette étude n'est plus dans le répertoire (terminée depuis plus de deux ans, ou retirée). <a href="https://clinicaltrials.gov/study/${esc(id)}" target="_blank" rel="noopener">Voir sur ClinicalTrials.gov ↗</a></p>`; return; }
  if (!location.hash.includes(id)) return;
  const x = s.x, L = DATA.find(d => d.id === id) || { ...s, frN: s.frSites.length, res: s.hasResults, phase: s.phase };
  const cts = L.v || [], on = favs.has(id);
  const pi = s.officials.find(o => /CHAIR|DIRECTOR/.test(o.r)) || s.officials[0];
  const H = t => `<h2>${t}</h2>`;
  document.title = `${s.acr || s.id} · ${x?.titre || s.title} · STUDYprogress`;
  v.innerHTML = `${back}
  <div class="fiche"><article>
    <div class="fh">${s.fr === "promo" ? `<span style="display:inline-flex;gap:6px;align-items:center;color:var(--fr);font-weight:600">${FLAG}Promotion française</span>` : L.fr ? `<span class="badge b-fr">${L.frN} centre${L.frN > 1 ? "s" : ""} en France</span>` : ""}${stTag(L)}<span>${esc(typeTxt(s))}</span>${s.dis.map(d => `<a class="pill" href="#/maladie/${d}">${esc(DIS[d]?.fr)}</a>`).join("")}</div>
    <h1>${esc(s.acr || s.id)}</h1>
    <p class="sub">${esc(x?.titre || s.title)}${x ? `<small lang="en">${esc(s.title)}</small>` : ""}</p>
    ${x ? `<div class="blk">${H("La question")}<p class="lead-q">${esc(x.question)}</p><p>${esc(x.profil)}</p>${schema(s, x)}</div>
    <div class="blk key">${H("Ce que l'étude pourrait changer")}${paras(x.interet)}</div>
    <div class="blk">${H("Contexte")}${paras(x.contexte)}</div>
    <div class="blk">${H("Qui est inclus")}<div class="two"><div><h3>Principaux critères d'inclusion</h3><ul>${x.inclusion.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
      <div><h3>Principaux critères d'exclusion</h3><ul>${x.exclusion.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div></div></div>`
    : `<p class="note en">La fiche en français n'est pas encore rédigée pour cette étude. Voici le schéma et le texte du registre, en anglais.</p>
    <div class="blk">${H("Schéma de l'étude")}${schema(s, null)}</div>
    <div class="blk" lang="en">${H("Résumé du registre")}${paras(s.summary)}</div>
    <div class="blk" lang="en"><details><summary>Critères d'inclusion et d'exclusion (registre)</summary><div class="raw">${esc(s.elig)}</div></details></div>`}
    <div class="blk">${H("Calendrier")}${calendar(s)}</div>
    ${x?.resultats || s.pubs.length || s.hasResults ? `<div class="blk key">${H("Résultats")}${x?.resultats ? paras(x.resultats) : ""}${s.pubs.length ? `<h3>Publications</h3><ul>${s.pubs.map(p => `<li>${p.pmid ? `<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(p.pmid)}/" target="_blank" rel="noopener">${esc(p.cit)}</a>` : esc(p.cit)}</li>`).join("")}</ul>` : ""}${s.hasResults ? `<p><a href="https://clinicaltrials.gov/study/${s.id}?tab=results" target="_blank" rel="noopener">Résultats détaillés sur ClinicalTrials.gov ↗</a></p>` : ""}</div>` : ""}
    ${x ? `<p class="note">Fiche rédigée automatiquement à partir du registre (${fdate(x.date)}) ; le registre fait foi.</p>` : ""}
  </article>
  <aside class="side">
    <div class="acts"><button class="btn fav2" data-f="${id}" aria-pressed="${on}">${on ? "★ Suivie" : "☆ Suivre"}</button></div>
    <div class="blk">${H("En bref")}<dl>
      <dt>Promoteur</dt><dd>${esc(s.sponsor)}${s.sClass === "INDUSTRY" ? " (industriel)" : ""}</dd>
      ${s.collabs.length ? `<dt>Partenaires</dt><dd>${esc(s.collabs.slice(0, 4).join(", "))}</dd>` : ""}
      ${pi ? `<dt>Coordination</dt><dd>${esc(pi.n || "")}${pi.a ? `, ${esc(pi.a)}` : ""}</dd>` : ""}
      <dt>Type</dt><dd>${s.type === "OBSERVATIONAL" ? "Observationnelle" : "Interventionnelle"}${s.phase ? `, ${s.phase.toLowerCase()}` : ""}</dd>
      <dt>Effectif</dt><dd>${s.n ?? "?"} patients ${s.nType === "ACTUAL" ? "inclus" : "prévus"}</dd>
      <dt>Âge</dt><dd>${s.maxAge ? `${esc(age(s.minAge))} à ${esc(age(s.maxAge))}` : `${esc(age(s.minAge))} et plus`}</dd>
      <dt>Centres</dt><dd>${s.sites ? `${s.sites} dans ${s.countries} pays` : "non précisés"}</dd>
      <dt>Registre</dt><dd>${s.id}</dd>
      <dt>Mise à jour</dt><dd>${fdate(s.upd)}</dd></dl>
      <a class="btn full" href="https://clinicaltrials.gov/study/${s.id}" target="_blank" rel="noopener">Voir le registre ↗</a></div>
    <div class="blk">${H(`Villes françaises · ${cts.length}`)}${cts.length ? `<div class="cities">${cts.map(c => `<span>${esc(c)}</span>`).join("")}</div>` : `<p style="font-size:.86rem;color:var(--muted)">Aucun centre français déclaré.</p>`}</div>
  </aside></div>`;
}

// ——— Navigation ———
let view = "", prevView = "";
const pos = {};
const parse = () => { const [path, qs = ""] = location.hash.replace(/^#\/?/, "").split("?"); return { path, q: new URLSearchParams(qs) }; };
function tabs() {
  const { path, q } = parse();
  const t = !path ? "home" : path === "etudes" ? (q.get("st") === "res" ? "res" : "etudes") : /^maladie/.test(path) ? "maladies" : "";
  for (const a of $("tabs").children) a.dataset.tab === t ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
}
function show(v) {
  prevView = view; view = v;
  for (const [id, k] of [["vHome", "home"], ["vList", "etudes"], ["vDis", "maladies"], ["vStudy", "study"]]) $(id).hidden = k !== v;
}
function route() {
  const { path, q } = parse(), h = location.hash;
  if (/^NCT\d{8}$/.test(path)) { show("study"); renderStudy(path); scrollTo(0, 0); }
  else if (path === "etudes") { show("etudes"); setF(q); prevDis = $("fDis").value; if (h !== lastQS) shown = 50; lastQS = h; renderList(); }
  else if (path === "maladies" || path.startsWith("maladie/")) { show("maladies"); renderDisease(path.split("/")[1]); }
  else { show("home"); renderHome(); document.title = "STUDYprogress · La recherche clinique en médecine interne"; }
  // En revenant d'une fiche, on retrouve la liste là où on l'avait laissée.
  if (view !== "study") scrollTo(0, prevView === "study" && pos[h] || 0);
  tabs();
}
let curHash = location.hash;
addEventListener("scroll", () => { if (location.hash === curHash) pos[curHash] = scrollY; }, { passive: true });
addEventListener("hashchange", () => { curHash = location.hash; route(); });

for (const id of Object.values(CTRL)) $(id)[id === "q" ? "oninput" : "onchange"] = onFilter;
// Choisir une maladie pré-sélectionne la phase 3 (les essais qui changent la pratique) ; « Tous types » reste à un clic.
let prevDis = "";
$("fDis").onchange = () => { const d = $("fDis").value; if (d && !prevDis && !$("fTy").value) $("fTy").value = "p3"; prevDis = d; onFilter(); };
$("fReset").onclick = () => { setF(new URLSearchParams()); prevDis = ""; onFilter(); };
$("moreList").onclick = () => { shown += 50; renderList(); };
function toggleFav(id) {
  favs.has(id) ? favs.delete(id) : favs.add(id);
  store("sp-favs", JSON.stringify([...favs])); $("favN").textContent = favs.size;
  const on = favs.has(id);
  for (const b of document.querySelectorAll(`[data-f="${id}"]`)) { b.setAttribute("aria-pressed", on); b.textContent = b.classList.contains("fav2") ? (on ? "★ Suivie" : "☆ Suivre") : on ? "★" : "☆"; }
}
document.addEventListener("click", e => {
  const f = e.target.closest("[data-f]");
  if (f) { e.preventDefault(); toggleFav(f.dataset.f); return; }
  if (e.target.closest("[data-back]")) { prevView ? history.back() : location.hash = "#/etudes"; return; }
});
document.addEventListener("submit", e => { if (e.target.id === "hform") { e.preventDefault(); location.hash = href("etudes", { q: $("hq").value.trim() }); } });
document.addEventListener("change", e => { if (e.target.id === "ville") { store("sp-ville", e.target.value); renderHome(); } });

fetch("data/studies.json").then(r => r.json()).then(j => {
  updated = j.updated; $("upd").textContent = fday(updated);
  for (const d of j.diseases) DIS[d.id] = d;
  CATS = [...new Set(j.diseases.map(d => d.cat))];
  DATA = j.studies;
  for (const s of DATA) { s.v ||= []; s.iv ||= []; s._txt = norm([s.id, s.acr, s.t, s.q, s.p, s.sponsor, s.phase, ...s.iv, ...s.v, ...s.dis.map(d => DIS[d].fr + " " + DIS[d].cat)].join(" ")); }
  $("fDis").innerHTML = `<option value="">Toutes les maladies</option>` + CATS.map(c => `<optgroup label="${esc(c)}"><option value="c:${esc(c)}">${esc(c)} (toutes)</option>${j.diseases.filter(d => d.cat === c).map(d => `<option value="${d.id}">${esc(d.fr)}</option>`).join("")}</optgroup>`).join("");
  $("fVille").innerHTML = `<option value="">Toutes les villes</option>` + cities().map(v => `<option>${esc(v)}</option>`).join("");
  $("favN").textContent = favs.size;
  route();
}).catch(() => { $("vHome").innerHTML = `<p class="empty">Impossible de charger les données. Rechargez la page.</p>`; });
</script>
</body>
</html>
